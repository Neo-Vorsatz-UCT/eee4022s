# Braccio Arm Physical Model

braccio:
  - name: "base" # identification
    disp: [0, 0, 0] # displacement in parent's coordinate system
    behaviour: "rot" # rotation or linear
    axis: "-z" # axis for rotation or linear
    range: [0, 180] # range of motion
  - name: "joint1"
    disp: [0, 0, 64]
    behaviour: "rot"
    axis: "-y"
    range: [15, 165]
  - name: "joint2"
    disp: [123, 0, 0]
    behaviour: "rot"
    axis: "-y"
    range: [0, 180]
  - name: "joint3"
    disp: [0, 0, -123]
    behaviour: "rot"
    axis: "y"
    range: [0, 180]
  - name: "wrist"
    disp: [60, 0, 0]
    behaviour: "rot"
    axis: "-x"
    range: [0, 180]
  - name: "claw"
    disp: [87, 0, 0]
    behaviour: "lin"
    axis: "z"
    range: [10, 73]

# == Movement directions ==
# base: top-down clockwise
# joint1: forward
# joint2: forward
# joint3: backward
# wrist: facing-forward anticlockwise
# claw: closing

# == Axes directions ==
# x-axis: towards the right of the robot
# y-axis: towards the front of the robot
# z-axis: towards the top of the robot
